<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GitHub Stars · AZX</title>
  </head>
  <body>
    <main id="app">
      <header>
        <h1>★ GitHub Stars</h1>
        <p id="whoami" class="whoami">…</p>
      </header>

      <p class="lede">
        This app fetches the public GitHub API <strong>directly from your browser</strong> — no
        platform gateway, no key. Until an admin approves the origin, the platform's
        Content-Security-Policy blocks the call and records a violation.
      </p>

      <form id="repo-form">
        <input id="repo-input" value="facebook/react" aria-label="owner/repo" spellcheck="false" />
        <button id="fetch-btn" type="submit">Fetch stars</button>
      </form>

      <section id="result" class="result" hidden></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
