<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Chatbot — AZX</title>
    <script type="module" crossorigin src="./assets/index-DbYUmVJ8.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Cji5tLGb.css">
  </head>
  <body>
    <main id="app">
      <header>
        <h1>Chatbot</h1>
        <p class="tagline">
          A static AZX app that talks to an LLM through the platform gateway. Pick the
          <strong>surface</strong> (our neutral shape vs OpenAI-compatible) and the
          <strong>model</strong> — the app never sees a vendor key.
        </p>
        <p id="whoami" class="whoami" aria-live="polite"></p>
        <div class="toolbar">
          <label>
            Surface
            <select id="endpoint">
              <option value="native">Agnostic — /_api/llm/chat</option>
              <option value="openai">OpenAI — /_api/openai/v1</option>
            </select>
          </label>
          <label>
            Model
            <select id="model" disabled>
              <option value="">(loading…)</option>
            </select>
          </label>
          <label class="check" title="Constrain the reply to a JSON schema">
            <input id="json-mode" type="checkbox" />
            JSON mode
          </label>
        </div>
        <div id="schema-box" class="schema-box" hidden>
          <label for="schema">
            Response schema (JSON Schema — object root, all keys in
            <code>required</code>, <code>additionalProperties: false</code>)
          </label>
          <textarea id="schema" rows="12" spellcheck="false"></textarea>
          <p id="schema-status" class="schema-status" aria-live="polite"></p>
        </div>
      </header>
      <ul id="messages" aria-live="polite"></ul>
      <form id="chat-form" autocomplete="off">
        <input
          id="chat-input"
          name="message"
          type="text"
          placeholder="Ask something and press Enter…"
          autofocus
        />
        <button id="send" type="submit">Send</button>
      </form>
    </main>
  </body>
</html>
