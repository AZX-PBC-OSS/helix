<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Chatbot — AZX</title>
  </head>
  <body>
    <main id="app">
      <header>
        <h1>Chatbot</h1>
        <p class="tagline">
          A static AZX app that talks to Claude through the platform gateway
          (<code>/_api/llm/chat</code>). The app never sees a vendor key.
        </p>
        <p id="whoami" class="whoami" aria-live="polite"></p>
      </header>
      <ul id="messages" aria-live="polite"></ul>
      <form id="chat-form" autocomplete="off">
        <input
          id="chat-input"
          name="message"
          type="text"
          placeholder="Ask Claude something and press Enter…"
          autofocus
        />
        <button id="send" type="submit">Send</button>
      </form>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
