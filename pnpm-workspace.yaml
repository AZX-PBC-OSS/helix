packages:
  - "apps/*"
  - "packages/*"

# esbuild (via tsx + vitest) links a native binary in its install script.
# prisma fetches its CLI engine artifacts on install.
allowBuilds:
  esbuild: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true

# Single-source dependency versions across the monorepo (pnpm catalog).
# Packages reference these with "catalog:" instead of pinning their own range,
# so a bump happens in exactly one place. https://pnpm.io/catalogs
catalog:
  # ── Runtime ──
  fastify: ^5.8.5
  zod: ^4.4.3
  "@fastify/multipart": ^10.0.0 # bundle upload (M1)
  # Registry persistence — portal only (the edge stays dependency-minimal and
  # hand-writes SQL; project plan §1, §6). Prisma 7 is Rust-engine-free and
  # needs a driver adapter (pg) passed to PrismaClient.
  "@prisma/client": ^7.8.0
  "@prisma/adapter-pg": ^7.8.0
  pg: ^8.21.0
  # Blob storage (Azurite in dev, Azure Blob in prod) — portal only.
  "@azure/storage-blob": ^12.32.0
  # Zip handling: yauzl reads (portal, streaming + zip-bomb-safe), archiver
  # writes (azx CLI).
  yauzl: ^3.4.0
  archiver: ^8.0.0
  fastify-plugin: ^6.0.0
  # ── Dev tooling ──
  "@eslint/js": ^10.0.1
  "@types/node": ^24.13.2 # track the Node 24 LTS runtime, not the odd/current 25.x line
  "@types/pg": ^8.20.0
  "@types/yauzl": ^3.3.0
  "@types/archiver": ^8.0.0
  prisma: ^7.8.0
  form-data: ^4.0.5 # build multipart bodies in app.inject tests
  eslint: ^10.4.1
  prettier: ^3.8.4
  tsx: ^4.22.4
  typescript: ^6.0.3
  typescript-eslint: ^8.61.0
  vitest: ^4.1.8
